<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8">
        <title>Facebook post box clone</title>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width,initial-scale=1.8">
        <script src="https://kit.fontawesome.com/417da195e6.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <div class="wrapper">
                <section class="post">
                    <header>Create Post</header>
                    <form action="#">
                        <div class="content">
                            <img src="logo.png" alt="Profile Image">
                            <div class="details">
                                <p>Bangladesh</p>
                                <div class="privacy">
                                    <i class="fas fa-user-friends"></i>
                                    <span>Friends</span>
                                    <i class="fas fa-caret-down"></i>
                                </div>
                            </div>
                        </div>
                        <textarea placeholder="What's on your mind,Bangladesh?"></textarea>
                        <div class="theme-emoji">
                            <img src="theme.svg" alt="">
                            <img src="smile.svg" alt="">
                            </div>
                            <div class="options">
                                <p>Add to your post</p>
                                <ul class="list">
                                    <li><img src="gallery.svg" alt=""></li>
                                    <li><img src="tag.svg" alt=""></li>
                                    <li><img src="emoji.svg" alt=""></li>
                                    <li><img src="mic.svg" alt=""></li>
                                    <li><img src="more.svg" alt=""></li>
                                </ul>
                        </div>
                        <button>post</button>
                    </form>
                </section>
            </div>
        </div>
    </body>
</html>
